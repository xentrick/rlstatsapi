name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      if: matrix.os == 'ubuntu-latest'
      run: cargo fmt --check
    - name: Build
      run: cargo build --all-targets --features dev-tools --verbose
    - name: Clippy
      if: matrix.os == 'ubuntu-latest'
      run: cargo clippy --all-targets --features python,dev-tools -- -D warnings
    - name: Run tests
      run: cargo test --features dev-tools --verbose
